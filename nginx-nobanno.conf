# Nobanno Nginx site config (serves via Gunicorn on loopback TCP 127.0.0.1:8000)
# HTTPS via Let's Encrypt (Certbot) certificates.

# HTTPS server (443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nobannoapp.online www.nobannoapp.online;

    ssl_certificate /etc/letsencrypt/live/nobannoapp.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nobannoapp.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /home/s/codes/nobobackend/staticfiles/;
    }

    location /media/ {
        alias /home/s/timage/;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
}

# HTTP server (80) -> redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nobannoapp.online www.nobannoapp.online;
    return 301 https://$host$request_uri;
}
